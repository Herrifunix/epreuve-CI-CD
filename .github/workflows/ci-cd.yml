name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # On convertit tout en minuscules pour Docker
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/vitalsync-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/vitalsync-frontend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: ./backend
        run: npm test

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Autorise GitHub Actions à pousser une image dans le repo des packages
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Convert repository name to lowercase
        run: |
          echo "LOWER_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
          
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/vitalsync-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/vitalsync-frontend:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for Compose
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

      - name: Start Staging Environment via Docker Compose
        run: docker compose up -d --build

      - name: Health Check Backend
        run: |
          echo "Attente de l'initialisation des conteneurs..."
          sleep 10
          # Effectue un appel GET. Si le serveur renvoie 200, le script continue. Sinon il sort en erreur (exit 1).
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000/health)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Echec du Health Check ! Code HTTP obtenu: $HTTP_STATUS"
            exit 1
          else
            echo "Health Check réussi ! Code HTTP obtenu: $HTTP_STATUS"
          fi
