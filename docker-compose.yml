version: '3.8'

services:
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vitalsync_net

  backend:
    build: 
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - PGHOST=database
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - PGPORT=5432
    networks:
      - vitalsync_net
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - vitalsync_net
    depends_on:
      - backend

# Déclaration du réseau bridge
networks:
  vitalsync_net:
    driver: bridge

# Déclaration du volume persistant
volumes:
  pgdata:
